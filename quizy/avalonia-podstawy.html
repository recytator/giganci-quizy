<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Avalonia UI – podstawy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
/* Wspólny styl wszystkich stron z quizami */
:root {
  --bg: #f6f3fa;
  --white: #ffffff;
  --text: #2a2236;
  --muted: #6b6178;
  --line: #e6e0ef;
  --purple: #7449a0;
  --purple-dark: #5c3786;
  --purple-soft: #efe8f7;
  --orange: #f07a1a;
  --orange-dark: #d9600a;
  --peach: #fde6d3;
  --green: #22a565;
  --green-soft: #e3f6ec;
  --red: #e0444f;
  --red-soft: #fde7e8;
  --shadow: 0 12px 32px rgba(70, 40, 110, 0.12);
  --radius: 24px;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  font-family: "Archivo", system-ui, -apple-system, "Segoe UI", sans-serif;
  color: var(--text);
  background: var(--bg);
  line-height: 1.5;
}

a { color: inherit; }

/* Górny pasek */
.topbar {
  background: var(--white);
  border-bottom: 1px solid var(--line);
}
.topbar-inner {
  max-width: 1080px;
  margin: 0 auto;
  padding: 14px 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}
.logo {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  font-weight: 800;
  font-size: 1.3rem;
  text-decoration: none;
  color: var(--purple);
  letter-spacing: -0.02em;
}
.logo-badge {
  display: grid;
  place-items: center;
  width: 38px;
  height: 38px;
  border-radius: 50%;
  background: var(--orange);
  color: var(--white);
  font-size: 1.1rem;
}
.logo .accent { color: var(--orange); }

/* Fioletowy baner */
.band {
  max-width: 1240px;
  margin: 12px auto 0;
  padding: 56px 16px 120px;
  border-radius: 32px;
  color: var(--white);
  background-color: var(--purple);
  background-image:
    radial-gradient(circle at 18px 18px, rgba(255, 255, 255, 0.07) 2px, transparent 3px),
    radial-gradient(circle at 90% 20%, rgba(255, 255, 255, 0.08), transparent 35%);
  background-size: 36px 36px, 100% 100%;
}
.band-inner { max-width: 1000px; margin: 0 auto; }
.band h1 {
  font-size: clamp(2rem, 6vw, 3.4rem);
  line-height: 1.08;
  margin: 18px 0 18px;
  font-weight: 800;
  letter-spacing: -0.03em;
}
.band h1 .accent { color: var(--orange); }
.band p { margin: 18px 0 0; font-size: 1.1rem; font-weight: 600; opacity: 0.95; max-width: 620px; }

.pill-info {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 6px 14px;
  border-radius: 999px;
  border: 1px solid rgba(255, 255, 255, 0.3);
  background: rgba(255, 255, 255, 0.08);
  font-size: 0.85rem;
  font-weight: 600;
}

.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 7px 14px;
  border-radius: 999px;
  background: var(--white);
  color: var(--text);
  font-weight: 700;
  font-size: 0.95rem;
}
.chip::before {
  content: "";
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--dot, var(--orange));
}

/* Treść nachodząca na baner */
.wrap {
  max-width: 1032px;
  margin: -80px auto 0;
  padding: 0 16px 64px;
  position: relative;
}

.tag {
  display: inline-block;
  padding: 5px 14px;
  border-radius: 999px;
  background: var(--peach);
  color: var(--orange-dark);
  font-size: 0.78rem;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: 0.08em;
}

/* Lista quizów */
.quiz-list {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 20px;
}
.quiz-card {
  display: flex;
  flex-direction: column;
  gap: 12px;
  padding: 24px;
  border-radius: var(--radius);
  background: var(--white);
  box-shadow: var(--shadow);
  text-decoration: none;
  transition: transform 0.15s, box-shadow 0.15s;
}
.quiz-card:hover { transform: translateY(-4px); box-shadow: 0 18px 40px rgba(70, 40, 110, 0.18); }
.quiz-card .icon {
  display: grid;
  place-items: center;
  width: 56px;
  height: 56px;
  border-radius: 50%;
  background: var(--purple-soft);
  font-size: 1.6rem;
}
.quiz-card h2 { margin: 0; font-size: 1.3rem; color: var(--purple); letter-spacing: -0.01em; }
.quiz-card p { margin: 0; color: var(--muted); }
.quiz-card .go { margin-top: auto; padding-top: 8px; font-weight: 800; color: var(--orange); }

/* Przyciski */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 15px 32px;
  border-radius: 999px;
  font: inherit;
  font-weight: 800;
  font-size: 1.05rem;
  cursor: pointer;
  text-decoration: none;
  transition: transform 0.1s, filter 0.15s;
}
.btn-primary {
  border: 0;
  color: var(--white);
  background: linear-gradient(180deg, #f68a2c, var(--orange-dark));
  box-shadow: 0 8px 20px rgba(240, 122, 26, 0.35);
}
.btn-primary:hover { filter: brightness(1.05); }
.btn-primary:active { transform: translateY(2px); }
.btn-ghost {
  background: var(--white);
  color: var(--purple);
  border: 2px solid var(--purple);
}
.btn-ghost:hover { background: var(--purple-soft); }
.btn:disabled { opacity: 0.4; cursor: not-allowed; box-shadow: none; }

/* Karta quizu */
.panel {
  background: var(--white);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: 32px 28px;
  max-width: 760px;
}

.checks { list-style: none; padding: 0; margin: 16px 0 28px; display: grid; gap: 12px; }
.checks li { display: flex; align-items: center; gap: 12px; font-weight: 600; }
.checks li::before {
  content: "✓";
  flex: none;
  display: grid;
  place-items: center;
  width: 26px;
  height: 26px;
  border-radius: 50%;
  background: var(--purple-soft);
  color: var(--purple);
  font-weight: 800;
  font-size: 0.85rem;
}

.progress-info {
  display: flex;
  justify-content: space-between;
  color: var(--muted);
  font-weight: 700;
  font-size: 0.9rem;
  margin-bottom: 10px;
}
.progress {
  height: 6px;
  border-radius: 999px;
  background: var(--line);
  overflow: hidden;
  margin-bottom: 26px;
}
.progress > div {
  height: 100%;
  width: 0;
  background: var(--orange);
  border-radius: inherit;
  transition: width 0.3s;
}

.question { font-size: 1.4rem; font-weight: 800; margin: 0 0 22px; letter-spacing: -0.01em; }

.answers { display: grid; gap: 12px; }
.answer {
  display: flex;
  align-items: center;
  gap: 14px;
  width: 100%;
  padding: 14px 16px;
  text-align: left;
  font: inherit;
  font-weight: 600;
  color: var(--text);
  background: var(--white);
  border: 2px solid var(--line);
  border-radius: 16px;
  cursor: pointer;
  transition: border-color 0.15s, background 0.15s;
}
.answer:hover:not(:disabled) { border-color: var(--purple); background: var(--purple-soft); }
.answer .letter {
  flex: none;
  display: grid;
  place-items: center;
  width: 34px;
  height: 34px;
  border-radius: 50%;
  background: var(--purple-soft);
  color: var(--purple);
  font-weight: 800;
}
.answer:disabled { cursor: default; }
.answer.correct { border-color: var(--green); background: var(--green-soft); }
.answer.correct .letter { background: var(--green); color: var(--white); }
.answer.wrong { border-color: var(--red); background: var(--red-soft); }
.answer.wrong .letter { background: var(--red); color: var(--white); }

.feedback {
  margin-top: 20px;
  padding: 16px 18px;
  border-radius: 16px;
  background: var(--green-soft);
}
.feedback.bad { background: var(--red-soft); }
.feedback strong { display: block; margin-bottom: 4px; }
.feedback p { margin: 0; color: var(--muted); }

.actions { display: flex; justify-content: flex-end; margin-top: 26px; gap: 12px; flex-wrap: wrap; }

.result { text-align: center; margin: 0 auto; }
.result .score {
  font-size: clamp(3rem, 14vw, 5rem);
  font-weight: 800;
  color: var(--purple);
  line-height: 1;
  margin: 16px 0 8px;
}
.result h2 { margin: 0; }
.result .actions { justify-content: center; }

.review { list-style: none; padding: 0; margin: 28px 0 0; text-align: left; display: grid; gap: 10px; }
.review li { padding: 12px 16px; border-radius: 14px; background: var(--green-soft); }
.review li.bad { background: var(--red-soft); }
.review li b { display: block; }
.review li span { color: var(--muted); font-size: 0.93rem; }

.hidden { display: none !important; }

footer { margin-top: 48px; text-align: center; color: var(--muted); font-size: 0.9rem; }

@media (max-width: 560px) {
  .band { margin: 0; border-radius: 0 0 28px 28px; padding: 36px 16px 100px; }
  .panel { padding: 24px 18px; }
  .actions .btn { width: 100%; }
}
</style>
</head>
<body>
<header class="topbar">

</header>

<section class="band">
  <div class="band-inner">
    <span class="pill-info"><span>Quiz · <span id="count"></span> pytań</span></span>
    <h1>Avalonia UI – <span class="accent">podstawy</span></h1>
    <div class="chips">
      <span class="chip">C#</span>
      <span class="chip" style="--dot:#7449a0">Avalonia</span>
      <span class="chip" style="--dot:#2f7de1">AXAML</span>
    </div>
  </div>
</section>

<div class="wrap">
  <!-- Ekran startowy -->
  <section id="start" class="panel">
    <span class="tag">Nowy quiz · Avalonia UI</span>
    <h2 class="question" style="margin-top:16px">Gotowy, żeby sprawdzić swoją wiedzę?</h2>
    <ul class="checks">
      <li>Jedna poprawna odpowiedź w każdym pytaniu</li>
      <li>Od razu widzisz, czy masz rację, i krótkie wyjaśnienie</li>
      <li>Na końcu wynik i lista poprawnych odpowiedzi</li>
    </ul>
    <button class="btn btn-primary" id="startBtn">Zaczynamy →</button>
  </section>

  <!-- Pytanie -->
  <section id="quiz" class="panel hidden">
    <div class="progress-info"><span id="qNum"></span><span id="qScore"></span></div>
    <div class="progress"><div id="bar"></div></div>
    <h2 class="question" id="qText"></h2>
    <div class="answers" id="answers"></div>
    <div class="feedback hidden" id="feedback"><strong id="fbTitle"></strong><p id="fbText"></p></div>
    <div class="actions"><button class="btn btn-primary" id="nextBtn" disabled>Dalej →</button></div>
  </section>

  <!-- Wynik -->
  <section id="result" class="panel result hidden">
    <span class="tag">Koniec quizu</span>
    <div class="score" id="score"></div>
    <h2 id="resultMsg"></h2>
    <div class="actions">
      <button class="btn btn-primary" id="againBtn">Jeszcze raz ↻</button>
      <a class="btn btn-ghost" href="../index.html">Inne quizy</a>
    </div>
    <ul class="review" id="review"></ul>
  </section>
</div>

<script>
// Pierwsza odpowiedź w "answers" jest poprawna – kolejność i tak jest losowana.
const QUESTIONS = [
  {
    q: "Do czego służy Avalonia UI?",
    answers: [
      "Do tworzenia aplikacji okienkowych z interfejsem graficznym, działających na Windows, macOS i Linux",
      "Do tworzenia gier 2D, w których rysujemy klatki w pętli",
      "Do pisania stron internetowych, które działają tylko w przeglądarce",
      "Do zarządzania bazami danych"
    ],
    explain: "Avalonia to framework do aplikacji okienkowych z GUI, które działają na Windows, macOS i Linux."
  },
  {
    q: "Czym różni się Avalonia od Raylib?",
    answers: [
      "Raylib służy do gier i rysuje klatki w pętli, a Avalonia daje gotowe kontrolki i czeka na akcje użytkownika",
      "Avalonia służy do gier, a Raylib do aplikacji okienkowych",
      "Niczym – to dwie nazwy tej samej biblioteki",
      "Raylib działa tylko na Linuxie, a Avalonia tylko na Windowsie"
    ],
    explain: "Raylib to biblioteka do gier – rysujemy klatki w pętli. Avalonia daje gotowe kontrolki (przyciski, pola tekstowe) i czeka na akcje użytkownika."
  },
  {
    q: "Co to jest AXAML?",
    answers: [
      "Język znaczników podobny do HTML, który opisuje wygląd interfejsu",
      "Nowa wersja języka C#",
      "Program do kompilowania aplikacji Avalonia",
      "Format plików z obrazkami używany w aplikacjach"
    ],
    explain: "AXAML to język znaczników podobny do HTML – opisuje, jakie kontrolki są w oknie i jak są rozmieszczone."
  },
  {
    q: "Po co w projekcie Avalonia mamy dwa pliki – AXAML i C#?",
    answers: [
      "AXAML opisuje wygląd aplikacji, a C# jej zachowanie – można zmieniać jedno bez ruszania drugiego",
      "AXAML opisuje zachowanie aplikacji, a C# jej wygląd",
      "Jeden plik to kopia zapasowa drugiego",
      "AXAML jest dla Windowsa, a C# dla Linuxa"
    ],
    explain: "AXAML = wygląd, C# = zachowanie. Dzięki temu jedno można zmieniać bez ruszania drugiego."
  },
  {
    q: "Która trójka to kontrolki, które poznaliście na lekcji?",
    answers: [
      "TextBlock, Button, TextBox",
      "Sprite, Texture, Sound",
      "Console, Random, Math",
      "Window, Loop, Frame"
    ],
    explain: "TextBlock wyświetla tekst, Button to przycisk, a TextBox to pole do wpisywania tekstu."
  },
  {
    q: "Co robi StackPanel?",
    answers: [
      "Układa kontrolki jedna pod drugą, po kolei",
      "Wyświetla tekst na ekranie",
      "Tworzy pole do wpisywania tekstu",
      "Zamyka okno aplikacji"
    ],
    explain: "StackPanel układa kontrolki po kolei – jedna pod drugą."
  },
  {
    q: "Jak sprawić, żeby przycisk coś robił po kliknięciu?",
    answers: [
      "W AXAML dodajemy atrybut Click z nazwą metody, a w pliku C# piszemy tę metodę",
      "Piszemy pętlę while, która cały czas sprawdza, czy przycisk jest wciśnięty",
      "Zmieniamy nazwę przycisku na Click",
      "Wpisujemy kod C# bezpośrednio w tekście przycisku"
    ],
    explain: "W AXAML dodajemy atrybut Click z nazwą metody, np. Click=\"OnButtonClick\", a w pliku C# piszemy tę metodę."
  },
  {
    q: "Jak odczytać tekst, który użytkownik wpisał w pole TextBox?",
    answers: [
      "Przez właściwość Text, np. MyInput.Text",
      "Przez Console.ReadLine()",
      "Przez właściwość Content, np. MyInput.Content",
      "Nie da się odczytać tekstu z TextBoxa"
    ],
    explain: "Wpisany tekst jest we właściwości Text, np. MyInput.Text."
  }
];

const $ = id => document.getElementById(id);
const LETTERS = "ABCD";
let order, current, score, history;

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function show(id) {
  ["start", "quiz", "result"].forEach(s => $(s).classList.toggle("hidden", s !== id));
  if (id !== "start") $(id).scrollIntoView({ behavior: "smooth", block: "start" });
}

function start() {
  order = shuffle(QUESTIONS);
  current = 0;
  score = 0;
  history = [];
  show("quiz");
  renderQuestion();
}

function renderQuestion() {
  const item = order[current];
  $("qNum").textContent = `Pytanie ${current + 1} z ${order.length}`;
  $("qScore").textContent = `Punkty: ${score}`;
  $("bar").style.width = `${(current / order.length) * 100}%`;
  $("qText").textContent = item.q;
  $("feedback").classList.add("hidden");
  $("nextBtn").disabled = true;
  $("nextBtn").textContent = current === order.length - 1 ? "Zobacz wynik →" : "Dalej →";

  const box = $("answers");
  box.innerHTML = "";
  shuffle(item.answers.map((text, i) => ({ text, correct: i === 0 }))).forEach((a, i) => {
    const btn = document.createElement("button");
    btn.className = "answer";
    btn.innerHTML = `<span class="letter">${LETTERS[i]}</span><span></span>`;
    btn.lastChild.textContent = a.text;
    btn.dataset.correct = a.correct;
    btn.addEventListener("click", () => choose(btn, item));
    box.appendChild(btn);
  });
}

function choose(btn, item) {
  const ok = btn.dataset.correct === "true";
  document.querySelectorAll(".answer").forEach(b => {
    b.disabled = true;
    if (b.dataset.correct === "true") b.classList.add("correct");
  });
  if (!ok) btn.classList.add("wrong");
  if (ok) score++;
  history.push({ q: item.q, ok, answer: item.answers[0] });

  $("qScore").textContent = `Punkty: ${score}`;
  $("bar").style.width = `${((current + 1) / order.length) * 100}%`;
  $("feedback").classList.remove("hidden");
  $("feedback").classList.toggle("bad", !ok);
  $("fbTitle").textContent = ok ? "Brawo, dobrze! 🎉" : "Niestety, nie tym razem.";
  $("fbText").textContent = item.explain;
  $("nextBtn").disabled = false;
  $("nextBtn").focus();
}

function next() {
  current++;
  if (current < order.length) renderQuestion();
  else finish();
}

function finish() {
  const pct = score / order.length;
  $("score").textContent = `${score}/${order.length}`;
  $("resultMsg").textContent =
    pct === 1 ? "Perfekcyjnie! Jesteś Gigantem! 🏆" :
    pct >= 0.75 ? "Świetna robota! 💪" :
    pct >= 0.5 ? "Nieźle! Powtórz kilka rzeczy i będzie super. 👍" :
    "Warto jeszcze raz przejrzeć lekcję. Dasz radę! 📚";

  const list = $("review");
  list.innerHTML = "";
  history.forEach(h => {
    const li = document.createElement("li");
    if (!h.ok) li.className = "bad";
    const b = document.createElement("b");
    b.textContent = (h.ok ? "✔ " : "✘ ") + h.q;
    const s = document.createElement("span");
    s.textContent = h.answer;
    li.append(b, s);
    list.appendChild(li);
  });
  show("result");
}

$("count").textContent = QUESTIONS.length;
$("startBtn").addEventListener("click", start);
$("nextBtn").addEventListener("click", next);
$("againBtn").addEventListener("click", start);
</script>
</body>
</html>
