<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Giganci Quizy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
/* Wspólny styl wszystkich stron z quizami */
:root {
  --bg: #170f3a;
  --bg-2: #22175a;
  --card: #2b1f6b;
  --card-2: #34277d;
  --line: rgba(255, 255, 255, 0.12);
  --text: #ffffff;
  --muted: #c6bfeb;
  --purple: #7c4dff;
  --pink: #ff4fa3;
  --yellow: #ffc83d;
  --green: #2ed47a;
  --red: #ff5a6e;
  --radius: 20px;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  font-family: "Poppins", system-ui, -apple-system, "Segoe UI", sans-serif;
  color: var(--text);
  background:
    radial-gradient(circle at 10% 0%, rgba(124, 77, 255, 0.35), transparent 45%),
    radial-gradient(circle at 100% 100%, rgba(255, 79, 163, 0.22), transparent 45%),
    var(--bg);
  background-attachment: fixed;
  line-height: 1.5;
}

a { color: inherit; }

.wrap {
  max-width: 820px;
  margin: 0 auto;
  padding: 24px 16px 64px;
}

/* Pasek u góry */
.topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 32px;
}

.logo {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  font-weight: 800;
  font-size: 1.25rem;
  text-decoration: none;
  letter-spacing: -0.02em;
}

.logo-badge {
  display: grid;
  place-items: center;
  width: 40px;
  height: 40px;
  border-radius: 12px;
  background: linear-gradient(135deg, var(--yellow), #ff9f1c);
  color: var(--bg);
  font-size: 1.1rem;
  font-weight: 800;
  box-shadow: 0 6px 0 #c77700;
}

.logo span.accent { color: var(--yellow); }

.back {
  color: var(--muted);
  text-decoration: none;
  font-weight: 600;
  font-size: 0.95rem;
}
.back:hover { color: var(--yellow); }

/* Nagłówek */
.hero h1 {
  font-size: clamp(1.9rem, 6vw, 2.8rem);
  line-height: 1.15;
  margin: 0 0 12px;
  font-weight: 800;
  letter-spacing: -0.02em;
}
.hero h1 .accent { color: var(--yellow); }
.hero p { color: var(--muted); margin: 0 0 32px; font-size: 1.05rem; }

.tag {
  display: inline-block;
  padding: 4px 12px;
  border-radius: 999px;
  background: rgba(255, 200, 61, 0.15);
  color: var(--yellow);
  font-size: 0.8rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.05em;
}

/* Lista quizów */
.quiz-list { display: grid; gap: 16px; }

.quiz-card {
  display: flex;
  align-items: center;
  gap: 18px;
  padding: 20px;
  border-radius: var(--radius);
  background: var(--card);
  border: 1px solid var(--line);
  text-decoration: none;
  transition: transform 0.15s, border-color 0.15s, background 0.15s;
}
.quiz-card:hover {
  transform: translateY(-3px);
  border-color: var(--yellow);
  background: var(--card-2);
}
.quiz-card .icon {
  flex: none;
  display: grid;
  place-items: center;
  width: 56px;
  height: 56px;
  border-radius: 16px;
  background: linear-gradient(135deg, var(--purple), var(--pink));
  font-size: 1.6rem;
}
.quiz-card h2 { margin: 4px 0 2px; font-size: 1.15rem; }
.quiz-card p { margin: 0; color: var(--muted); font-size: 0.92rem; }
.quiz-card .go {
  margin-left: auto;
  flex: none;
  font-size: 1.4rem;
  color: var(--yellow);
}

/* Przyciski */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 14px 28px;
  border: 0;
  border-radius: 999px;
  font: inherit;
  font-weight: 700;
  font-size: 1rem;
  cursor: pointer;
  text-decoration: none;
  transition: transform 0.1s, box-shadow 0.1s;
}
.btn-primary {
  background: var(--yellow);
  color: var(--bg);
  box-shadow: 0 5px 0 #c77700;
}
.btn-primary:active { transform: translateY(3px); box-shadow: 0 2px 0 #c77700; }
.btn-ghost {
  background: transparent;
  color: var(--text);
  border: 2px solid var(--line);
}
.btn-ghost:hover { border-color: var(--yellow); }
.btn:disabled { opacity: 0.4; cursor: not-allowed; }

/* Quiz */
.panel {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 28px 24px;
}

.progress-info {
  display: flex;
  justify-content: space-between;
  color: var(--muted);
  font-weight: 600;
  font-size: 0.9rem;
  margin-bottom: 8px;
}
.progress {
  height: 10px;
  border-radius: 999px;
  background: var(--bg-2);
  overflow: hidden;
  margin-bottom: 24px;
}
.progress > div {
  height: 100%;
  width: 0;
  background: linear-gradient(90deg, var(--yellow), var(--pink));
  border-radius: inherit;
  transition: width 0.3s;
}

.question { font-size: 1.3rem; font-weight: 700; margin: 0 0 20px; }

.answers { display: grid; gap: 12px; }

.answer {
  display: flex;
  align-items: center;
  gap: 14px;
  width: 100%;
  padding: 14px 16px;
  text-align: left;
  font: inherit;
  color: var(--text);
  background: var(--bg-2);
  border: 2px solid var(--line);
  border-radius: 14px;
  cursor: pointer;
  transition: border-color 0.15s, background 0.15s;
}
.answer:hover:not(:disabled) { border-color: var(--purple); background: #2a1d6a; }
.answer .letter {
  flex: none;
  display: grid;
  place-items: center;
  width: 32px;
  height: 32px;
  border-radius: 10px;
  background: var(--card-2);
  font-weight: 800;
  color: var(--yellow);
}
.answer:disabled { cursor: default; }
.answer.correct { border-color: var(--green); background: rgba(46, 212, 122, 0.15); }
.answer.correct .letter { background: var(--green); color: var(--bg); }
.answer.wrong { border-color: var(--red); background: rgba(255, 90, 110, 0.15); }
.answer.wrong .letter { background: var(--red); color: var(--bg); }

.feedback {
  margin-top: 20px;
  padding: 14px 16px;
  border-radius: 14px;
  background: var(--bg-2);
  border-left: 5px solid var(--green);
}
.feedback.bad { border-left-color: var(--red); }
.feedback strong { display: block; margin-bottom: 4px; }
.feedback p { margin: 0; color: var(--muted); }

.actions { display: flex; justify-content: flex-end; margin-top: 24px; gap: 12px; flex-wrap: wrap; }

.result { text-align: center; }
.result .score {
  font-size: clamp(3rem, 14vw, 5rem);
  font-weight: 800;
  color: var(--yellow);
  line-height: 1;
  margin: 12px 0;
}
.result .actions { justify-content: center; }

.review { list-style: none; padding: 0; margin: 28px 0 0; text-align: left; display: grid; gap: 10px; }
.review li {
  padding: 12px 14px;
  border-radius: 12px;
  background: var(--bg-2);
  border-left: 5px solid var(--green);
}
.review li.bad { border-left-color: var(--red); }
.review li b { display: block; }
.review li span { color: var(--muted); font-size: 0.92rem; }

.hidden { display: none !important; }

footer { margin-top: 48px; text-align: center; color: var(--muted); font-size: 0.85rem; }

@media (max-width: 520px) {
  .panel { padding: 22px 16px; }
  .quiz-card { padding: 16px; gap: 14px; }
  .quiz-card .icon { width: 48px; height: 48px; font-size: 1.3rem; }
  .actions .btn { width: 100%; }
}
</style>
</head>
<body>
<div class="wrap">
  <header class="topbar">
    <a class="logo" href="index.html"><span class="logo-badge">G</span> Giganci <span class="accent">Quizy</span></a>
  </header>

  <section class="hero">
    <span class="tag">Sprawdź się!</span>
    <h1>Quizy z <span class="accent">programowania</span></h1>
    <p>Wybierz quiz i sprawdź, ile zapamiętałeś z lekcji.</p>
  </section>

  <!-- Nowy quiz = nowy plik w folderze quizy/ + nowa karta poniżej -->
  <main class="quiz-list">
    <a class="quiz-card" href="quizy/avalonia-podstawy.html">
      <div class="icon">🖥️</div>
      <div>
        <span class="tag">C# · Avalonia</span>
        <h2>Avalonia UI – podstawy</h2>
        <p>8 pytań · AXAML, kontrolki, przyciski i TextBox</p>
      </div>
      <div class="go">➜</div>
    </a>
  </main>

  <footer>Powodzenia! 🚀</footer>
</div>
</body>
</html>
